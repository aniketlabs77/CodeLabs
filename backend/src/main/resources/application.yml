server:
  port: 8080

spring:
  application:
    name: codelabs-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/codelabs_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
